# Yerelde uçtan uca: postgres + redis + mock sağlayıcılar + api tek komutla.
#   docker compose up --build
# Sonra:
#   WEG sağlayıcıları (provider1 JSON / provider2 XML) OTOMATİK seed edilir ve scheduler
#   açılıştan ~15 sn sonra çeker → dashboard kendiliğinden dolar.
#   Elle: POST /api/fetch (ApiKey: dev-local-api-key-change-me) ; GET /api/search?keyword=go ; /scalar
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contenthub
      POSTGRES_PASSWORD: contenthub
      POSTGRES_DB: contenthub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contenthub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mock-providers:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./mock-providers:/app
    command: node server.js
    environment:
      PORT: "4010"
    ports:
      - "4010:4010"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mock-providers:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ContentHub: "Host=postgres;Port=5432;Database=contenthub;Username=contenthub;Password=contenthub"
      ConnectionStrings__Redis: "redis:6379"
      ContentHub__ApiKey: "dev-local-api-key-change-me"
      ContentHub__InitializeDatabase: "true"
      ContentSearch__Scheduler__Enabled: "true"
      ContentSearch__Scheduler__InitialDelay: "00:00:15"
    ports:
      - "8080:8080"

  dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: sh -c "npm install && npm run dev -- -p 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    depends_on:
      - api
    ports:
      - "3000:3000"
